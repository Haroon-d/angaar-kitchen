services:
  postgres:
    image: postgres:16-alpine
    container_name: angaar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: angaar_kitchen
      POSTGRES_USER: angaar
      POSTGRES_PASSWORD: angaar_dev_password
    ports:
      - "5432:5432"
    volumes:
      - angaar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angaar -d angaar_kitchen"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  angaar_postgres_data:
